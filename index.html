<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>育林國中夢想導航員</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex justify-center items-center">
  <div class="max-w-xl w-full bg-white rounded-2xl shadow-lg p-6">
    <h1 class="text-2xl font-bold text-blue-900 mb-1">🎓 育林國中夢想導航員</h1>
    <p class="text-gray-500 mb-4 text-sm">選擇模擬考/會考等級，獲取基北區落點與樹林通勤建議。</p>

    <!-- 分數選擇區 -->
    <div id="scoreForm" class="grid grid-cols-2 gap-3 mb-4">
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">國文</label>
        <select id="chi" class="w-full border p-2 rounded-lg bg-gray-50 text-sm"><option>A++</option><option>A+</option><option>A</option><option selected>B++</option><option>B+</option><option>B</option><option>C</option></select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">英文</label>
        <select id="eng" class="w-full border p-2 rounded-lg bg-gray-50 text-sm"><option>A++</option><option>A+</option><option>A</option><option selected>B++</option><option>B+</option><option>B</option><option>C</option></select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">數學</label>
        <select id="math" class="w-full border p-2 rounded-lg bg-gray-50 text-sm"><option>A++</option><option>A+</option><option>A</option><option selected>B++</option><option>B+</option><option>B</option><option>C</option></select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">自然</label>
        <select id="sci" class="w-full border p-2 rounded-lg bg-gray-50 text-sm"><option>A++</option><option>A+</option><option>A</option><option selected>B++</option><option>B+</option><option>B</option><option>C</option></select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">社會</label>
        <select id="soc" class="w-full border p-2 rounded-lg bg-gray-50 text-sm"><option>A++</option><option>A+</option><option>A</option><option selected>B++</option><option>B+</option><option>B</option><option>C</option></select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">寫作測驗</label>
        <select id="write" class="w-full border p-2 rounded-lg bg-gray-50 text-sm"><option>6 級分</option><option>5 級分</option><option selected>4 級分</option><option>3 級分</option></select>
      </div>
    </div>

    <button onclick="firstAnalyze()" id="startBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow mb-4">開始落點分析</button>

    <!-- 對話歷史紀錄區 -->
    <div id="chatHistory" class="space-y-4 max-h-96 overflow-y-auto mb-4 hidden p-2 border-t"></div>

    <!-- 追問輸入區 -->
    <div id="followUpArea" class="flex gap-2 hidden">
      <input type="text" id="userInput" placeholder="繼續追問，例如：想去板橋高中要怎麼準備？" class="flex-1 border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button onclick="sendFollowUp()" id="sendBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 rounded-xl text-sm transition">發送</button>
    </div>
  </div>

  <script>
    let conversation = [];

    async function firstAnalyze() {
      const startBtn = document.getElementById('startBtn');
      startBtn.disabled = true;
      startBtn.innerText = '正在計算落點與通勤時間...';

      const promptText = `育林國中學生成績：國文${document.getElementById('chi').value}、英文${document.getElementById('eng').value}、數學${document.getElementById('math').value}、自然${document.getElementById('sci').value}、社會${document.getElementById('soc').value}、作文${document.getElementById('write').value}。請進行分析。`;
      
      conversation.push({ role: 'user', text: promptText });
      await callAPI();

      document.getElementById('scoreForm').classList.add('hidden');
      startBtn.classList.add('hidden');
      document.getElementById('followUpArea').classList.remove('hidden');
    }

    async function sendFollowUp() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      appendMessage('user', text);
      conversation.push({ role: 'user', text: text });

      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;
      sendBtn.innerText = '思考中...';

      await callAPI();
      sendBtn.disabled = false;
      sendBtn.innerText = '發送';
    }

    async function callAPI() {
      const chatHistoryDiv = document.getElementById('chatHistory');
      chatHistoryDiv.classList.remove('hidden');

      try {
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: conversation })
        });
        const data = await response.json();
        const reply = data.result;

        conversation.push({ role: 'model', text: reply });
        appendMessage('model', reply);
      } catch (err) {
        appendMessage('model', '連線異常，請稍後再試。');
      }
    }

    function appendMessage(role, text) {
      const chatHistoryDiv = document.getElementById('chatHistory');
      const msgDiv = document.createElement('div');
      msgDiv.className = role === 'user' 
        ? 'bg-blue-50 border border-blue-200 text-blue-900 p-3 rounded-xl text-sm self-end' 
        : 'bg-gray-50 border border-gray-200 text-gray-800 p-4 rounded-xl text-sm leading-relaxed whitespace-pre-line';
      msgDiv.innerText = text;
      chatHistoryDiv.appendChild(msgDiv);
      chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;
    }
  </script>
</body>
</html>
