<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>育林國中夢想導航員</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex justify-center items-center">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-6">
    <h1 class="text-2xl font-bold text-blue-900 mb-1">🎓 育林國中夢想導航員</h1>
    <p class="text-gray-500 mb-6 text-sm">選擇模擬考/會考等級，獲取基北區落點與樹林通勤建議。</p>

    <div class="grid grid-cols-2 gap-3 mb-6">
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">國文</label>
        <select id="chi" class="w-full border p-2 rounded-lg bg-gray-50 text-sm"><option>A++</option><option>A+</option><option>A</option><option selected>B++</option><option>B+</option><option>B</option><option>C</option></select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">英文</label>
        <select id="eng" class="w-full border p-2 rounded-lg bg-gray-50 text-sm"><option>A++</option><option>A+</option><option>A</option><option selected>B++</option><option>B+</option><option>B</option><option>C</option></select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">數學</label>
        <select id="math" class="w-full border p-2 rounded-lg bg-gray-50 text-sm"><option>A++</option><option>A+</option><option>A</option><option selected>B++</option><option>B+</option><option>B</option><option>C</option></select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">自然</label>
        <select id="sci" class="w-full border p-2 rounded-lg bg-gray-50 text-sm"><option>A++</option><option>A+</option><option>A</option><option selected>B++</option><option>B+</option><option>B</option><option>C</option></select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">社會</label>
        <select id="soc" class="w-full border p-2 rounded-lg bg-gray-50 text-sm"><option>A++</option><option>A+</option><option>A</option><option selected>B++</option><option>B+</option><option>B</option><option>C</option></select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">寫作測驗</label>
        <select id="write" class="w-full border p-2 rounded-lg bg-gray-50 text-sm"><option>6 級分</option><option>5 級分</option><option selected>4 級分</option><option>3 級分</option></select>
      </div>
    </div>

    <button onclick="startAnalyze()" id="btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow">開始落點分析</button>

    <div id="result" class="mt-6 p-4 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-sm leading-relaxed whitespace-pre-line hidden"></div>
  </div>

  <script>
    async function startAnalyze() {
      const btn = document.getElementById('btn');
      const result = document.getElementById('result');
      
      btn.disabled = true;
      btn.innerText = '正在計算落點與通勤時間...';
      result.classList.add('hidden');

      const scores = {
        chi: document.getElementById('chi').value,
        eng: document.getElementById('eng').value,
        math: document.getElementById('math').value,
        sci: document.getElementById('sci').value,
        soc: document.getElementById('soc').value,
        write: document.getElementById('write').value
      };

      try {
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scores })
        });
        const data = await response.json();
        result.innerText = data.result || data.error;
        result.classList.remove('hidden');
      } catch (err) {
        alert('連線失敗，請再試一次！');
      } finally {
        btn.disabled = false;
        btn.innerText = '開始落點分析';
      }
    }
  </script>
</body>
</html>
